<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <title>Paji Mario</title>
  <link href="paji-mario/mario.css" rel="stylesheet">
  <script src="paji-mario/data.js"></script>
  <script src="paji-mario/editor.js"></script>
  <script src="paji-mario/gamepad.js"></script>
  <script src="paji-mario/generator.js"></script>
  <script src="paji-mario/library.js"></script>
  <script src="paji-mario/load.js"></script>
  <script src="paji-mario/maps.js"></script>
  <script src="paji-mario/mario.js"></script>
  <script src="paji-mario/sprites.js"></script>
  <script src="paji-mario/things.js"></script>
  <script src="paji-mario/toned.js"></script>
  <script src="paji-mario/triggers.js"></script>
  <script src="paji-mario/upkeep.js"></script>
  <script src="paji-mario/utility.js"></script>
  <script src="paji-mario/src/AudioPlayr/AudioPlayr.js"></script>
  <script src="paji-mario/src/TimeHandlr/TimeHandlr.js"></script>
  <script src="paji-mario/src/QuadsKeepr/QuadsKeepr.js"></script>
  <script>
  (function(){
    "use strict";
    /* Paji is rendered as lightweight procedural pixel art; the photo is not used as a texture. */
    var P=window.__pajiLayer={pressed:Object.create(null),pointers:Object.create(null)};

    function prep(t){
      t.spritewidthpixels=Math.max(1,t.spritewidth*unitsize);
      t.spriteheightpixels=Math.max(1,t.spriteheight*unitsize);
      t.canvas=getCanvas(t.spritewidthpixels,t.spriteheightpixels);
      t.context=t.canvas.getContext("2d");
      t.context.imageSmoothingEnabled=false;
      t.canvas.style.imageRendering="pixelated";
      t.sprite_type="normal"; t.num_sprites=1;
    }
    function paji(t){
      prep(t);
      var c=t.context,w=t.spritewidthpixels,h=t.spriteheightpixels;
      var sx=w/16,sy=h/20,cl=String(t.className||"").toLowerCase();
      var move=cl.indexOf("running")>=0||cl.indexOf("walking")>=0;
      var air=cl.indexOf("jumping")>=0||cl.indexOf("falling")>=0;
      var dead=cl.indexOf("dead")>=0||cl.indexOf("death")>=0;
      var phase=(Date.now()/130|0)&1;
      function q(x,y,ww,hh,col){c.fillStyle=col;c.fillRect(Math.round(x*sx),Math.round(y*sy),Math.max(1,Math.round(ww*sx)),Math.max(1,Math.round(hh*sy)));}
      c.clearRect(0,0,w,h);
      if(dead){q(2,9,12,2,"#222");q(3,11,10,5,"#1769b0");q(4,16,8,2,"#0d4778");return;}
      /* Hair, face and stylized facial hair. */
      q(5,2,6,1,"#17151a");q(4,3,8,3,"#17151a");q(4,6,1,3,"#17151a");q(11,6,1,3,"#17151a");
      q(5,5,6,6,"#c9825f");q(4,7,1,2,"#b66c4e");q(11,7,1,2,"#b66c4e");q(6,10,4,2,"#b86f50");
      q(5,5,2,2,"#17151a");q(7,5,2,1,"#17151a");q(9,5,2,2,"#17151a");
      q(6,8,1,1,"#111");q(9,8,1,1,"#111");q(8,8,1,1,"#a45d43");
      q(6,9,5,2,"#382b28");q(7,8,3,1,"#382b28");q(8,10,1,1,"#382b28");
      /* Blue shirt and legs. */
      q(4,12,8,5,"#1769b0");q(5,11,6,2,"#2387d0");q(5,16,6,1,"#0e4d86");
      if(air){q(2,10,2,2,"#1769b0");q(3,11,2,2,"#c9825f");q(12,10,2,2,"#1769b0");q(11,11,2,2,"#c9825f");}
      else if(move&&phase){q(3,12,2,3,"#1769b0");q(11,13,2,3,"#1769b0");q(3,15,2,1,"#c9825f");q(11,16,2,1,"#c9825f");}
      else{q(3,13,2,3,"#1769b0");q(11,13,2,3,"#1769b0");q(3,16,2,1,"#c9825f");q(11,16,2,1,"#c9825f");}
      if(air){q(5,17,2,2,"#173b66");q(9,17,2,2,"#173b66");q(4,19,3,1,"#17151a");q(9,19,3,1,"#17151a");}
      else if(move&&phase){q(5,17,2,2,"#173b66");q(9,17,2,2,"#173b66");q(4,19,4,1,"#17151a");q(10,19,3,1,"#17151a");}
      else{q(5,17,2,2,"#173b66");q(9,17,2,2,"#173b66");q(4,19,3,1,"#17151a");q(9,19,3,1,"#17151a");}
    }
    function notebook(t){
      prep(t);var c=t.context,w=t.spritewidthpixels,h=t.spriteheightpixels;
      c.fillStyle="#fffdf4";c.fillRect(1,1,w-2,h-2);c.strokeStyle="#20252b";c.strokeRect(1,1,w-2,h-2);
      c.fillStyle="#e04b4b";c.fillRect(unitsize,0,unitsize*.8,h);
      c.fillStyle="#20252b";c.beginPath();c.arc(w*.3,h*.31,unitsize*.5,0,7);c.arc(w*.7,h*.31,unitsize*.5,0,7);c.fill();
    }
    function pencil(t){
      prep(t);var c=t.context,w=t.spritewidthpixels,h=t.spriteheightpixels;
      c.fillStyle="#e5b32e";c.fillRect(w*.25,0,w*.5,h*.82);c.fillStyle="#f5e7c7";c.fillRect(w*.18,h*.16,w*.64,h*.5);
      c.strokeStyle="#242424";c.strokeRect(w*.18,h*.16,w*.64,h*.5);c.fillStyle="#111";c.beginPath();c.arc(w*.4,h*.39,unitsize*.55,0,7);c.arc(w*.6,h*.39,unitsize*.55,0,7);c.fill();
    }

    var originalSetThingSprite=window.setThingSprite;
    window.setThingSprite=function(t){
      if(t&&(t.player||t.title==="Paji"))return paji(t);
      if(t&&t.title==="Koopa")return notebook(t);
      if(t&&t.title==="Bowser")return pencil(t);
      return originalSetThingSprite(t);
    };
    var originalPlacePlayer=window.placePlayer;
    if(typeof originalPlacePlayer==="function")window.placePlayer=function(){
      var r=originalPlacePlayer.apply(this,arguments);
      if(window.player){window.player.title="Paji";window.setThingSprite(window.player);}
      return r;
    };

    function press(code,e,el){
      if(e)e.preventDefault();
      if(!P.pressed[code]){P.pressed[code]=true;if(el)el.classList.add("is-pressed");window.keydown(code);}
    }
    function release(code,e,el){
      if(e)e.preventDefault();
      if(P.pressed[code]){delete P.pressed[code];if(el)el.classList.remove("is-pressed");window.keyup(code);}
    }
    function bind(id,code){
      var el=document.getElementById(id);if(!el||el.__pajiBound)return;el.__pajiBound=true;
      el.addEventListener("pointerdown",function(e){P.pointers[e.pointerId]=code;try{el.setPointerCapture(e.pointerId);}catch(x){}press(code,e,el);},{passive:false});
      ["pointerup","pointercancel","pointerleave","lostpointercapture"].forEach(function(n){el.addEventListener(n,function(e){
        if(P.pointers[e.pointerId]===code){delete P.pointers[e.pointerId];release(code,e,el);}
      },{passive:false});});
      el.addEventListener("contextmenu",function(e){e.preventDefault();},{passive:false});
    }

    function syncViewport(){
      var w=innerWidth,h=innerHeight,cvs=document.querySelector("canvas");
      if(cvs&&(cvs.width!==w||cvs.height!==h)){
        try{cvs.parentNode.removeChild(cvs);if(typeof resetCanvas==="function")resetCanvas();cvs=document.querySelector("canvas");}catch(x){}
      }
      if(cvs){cvs.style.left="0";cvs.style.top="0";cvs.style.width=w+"px";cvs.style.height=h+"px";}
      if(window.gamescreen&&typeof resetGameScreenPosition==="function")try{resetGameScreenPosition(window.gamescreen);}catch(x){}
      if(window.QuadsKeeper&&typeof QuadsKeeper.updateQuadrants==="function")try{QuadsKeeper.updateQuadrants();}catch(x){}
    }

    function fullscreen(){
      var root=document.documentElement,active=document.fullscreenElement||document.webkitFullscreenElement;
      var req=root.requestFullscreen||root.webkitRequestFullscreen,exit=document.exitFullscreen||document.webkitExitFullscreen;
      try{if(active){if(exit)exit.call(document);}else if(req)req.call(root);}catch(x){console.warn("Fullscreen unavailable:",x);}
    }

    function boot(){
      if(window.__pajiBooted)return;window.__pajiBooted=true;
      var b=document.getElementById("pajiBoot");
      try{if(typeof FullScreenMario!=="function")throw new Error("FullScreenMario is missing");FullScreenMario();syncViewport();if(b)b.style.display="none";}
      catch(err){console.error("Paji Mario boot error:",err);if(b){b.className="error";b.textContent="PAJI MARIO ERROR — "+(err&&err.message||err);}}
    }

    document.addEventListener("DOMContentLoaded",function(){
      bind("pajiLeft",37);bind("pajiRight",39);bind("pajiRun",16);bind("pajiJump",38);
      var fs=document.getElementById("pajiFullscreen");if(fs)fs.addEventListener("click",fullscreen);
      boot();
    });
    var rf=0;
    function scheduleViewportSync(){if(rf)cancelAnimationFrame(rf);rf=requestAnimationFrame(function(){rf=0;syncViewport();});}
    window.addEventListener("resize",scheduleViewportSync,{passive:true});
    window.addEventListener("orientationchange",scheduleViewportSync,{passive:true});
    document.addEventListener("fullscreenchange",scheduleViewportSync,{passive:true});
    document.addEventListener("webkitfullscreenchange",scheduleViewportSync,{passive:true});
    window.addEventListener("blur",function(){Object.keys(P.pressed).forEach(function(k){release(Number(k));});P.pointers=Object.create(null);});
  })();
  </script>
</head>
<body>
  <div id="pajiTitle">PAJI MARIO</div>
  <div id="pajiBoot">LOADING PAJI MARIO...</div>
  <div id="pajiMenu">
    <button type="button" onclick="setMapRandom()">RANDOM WORLD</button>
    <button type="button" onclick="loadEditor()">LEVEL EDITOR</button>
    <button type="button" onclick="toggleAutoRespawn(this)">REVIVE</button>
    <button id="pajiFullscreen" type="button" aria-label="Toggle fullscreen">FULL</button>
  </div>
  <div id="pajiMobileControls" aria-label="Mobile controls">
    <div class="pajiPad">
      <button id="pajiLeft" class="pajiBtn" aria-label="Move left">◀</button>
      <button id="pajiRight" class="pajiBtn" aria-label="Move right">▶</button>
    </div>
    <div class="pajiPad">
      <button id="pajiRun" class="pajiBtn" aria-label="Run">⚡</button>
      <button id="pajiJump" class="pajiBtn" aria-label="Jump">▲</button>
    </div>
  </div>
</body>
</html>
