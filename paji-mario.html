<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <title>Paji Mario</title>
  <link href="paji-mario/mario.css" rel="stylesheet">
  <script src="paji-mario/data.js"></script>
  <script src="paji-mario/editor.js"></script>
  <script src="paji-mario/gamepad.js"></script>
  <script src="paji-mario/generator.js"></script>
  <script src="paji-mario/library.js"></script>
  <script src="paji-mario/load.js"></script>
  <script src="paji-mario/maps.js"></script>
  <script src="paji-mario/mario.js"></script>
  <script src="paji-mario/sprites.js"></script>
  <script src="paji-mario/things.js"></script>
  <script src="paji-mario/toned.js"></script>
  <script src="paji-mario/triggers.js"></script>
  <script src="paji-mario/upkeep.js"></script>
  <script src="paji-mario/utility.js"></script>
  <script src="paji-mario/src/AudioPlayr/AudioPlayr.js"></script>
  <script src="paji-mario/src/TimeHandlr/TimeHandlr.js"></script>
  <script src="paji-mario/src/QuadsKeepr/QuadsKeepr.js"></script>
  <script>
  (function(){
    "use strict";
    var face=new Image();
    face.src="paji-face.jpg?v=1";

    function prep(t){
      t.spritewidthpixels=t.spritewidth*unitsize;
      t.spriteheightpixels=t.spriteheight*unitsize;
      t.canvas=getCanvas(t.spritewidthpixels,t.spriteheightpixels);
      t.context=t.canvas.getContext("2d");
      t.context.imageSmoothingEnabled=true;
      t.sprite_type="normal";
      t.num_sprites=1;
    }
    function paji(t){
      prep(t);
      var c=t.context,w=t.spritewidthpixels,h=t.spriteheightpixels;
      c.clearRect(0,0,w,h);
      c.fillStyle="#1769b0";
      c.fillRect(w*.10,h*.69,w*.80,h*.31);
      if(face.complete && face.naturalWidth){
        var scale=Math.min((w*.86)/face.naturalWidth,(h*.72)/face.naturalHeight);
        var dw=face.naturalWidth*scale,dh=face.naturalHeight*scale;
        c.drawImage(face,0,0,face.naturalWidth,face.naturalHeight,(w-dw)/2,0,dw,dh);
      }
      c.fillStyle="#0f4e87";
      c.fillRect(w*.16,h*.88,w*.68,h*.12);
    }
    function notebook(t){
      prep(t);var c=t.context,w=t.spritewidthpixels,h=t.spriteheightpixels;
      c.fillStyle="#fffdf4";c.fillRect(1,1,w-2,h-2);
      c.strokeStyle="#20252b";c.lineWidth=Math.max(1,unitsize*.55);c.strokeRect(1,1,w-2,h-2);
      c.fillStyle="#e04b4b";c.fillRect(unitsize,0,unitsize*.8,h);
      c.strokeStyle="#6ca5e8";c.lineWidth=Math.max(1,unitsize*.25);
      for(var y=unitsize*2;y<h;y+=unitsize*2.1){c.beginPath();c.moveTo(unitsize*2,y);c.lineTo(w-unitsize,y);c.stroke();}
      c.fillStyle="#20252b";c.beginPath();c.arc(w*.3,h*.31,unitsize*.5,0,7);c.arc(w*.7,h*.31,unitsize*.5,0,7);c.fill();
      c.strokeStyle="#20252b";c.beginPath();c.arc(w*.5,h*.52,w*.2,.15*Math.PI,.85*Math.PI);c.stroke();
    }
    function pencil(t){
      prep(t);var c=t.context,w=t.spritewidthpixels,h=t.spriteheightpixels;
      c.fillStyle="#e5b32e";c.fillRect(w*.25,0,w*.5,h*.82);
      c.fillStyle="#f5e7c7";c.fillRect(w*.18,h*.16,w*.64,h*.5);
      c.strokeStyle="#242424";c.strokeRect(w*.18,h*.16,w*.64,h*.5);
      c.fillStyle="#111";c.beginPath();c.arc(w*.4,h*.39,unitsize*.55,0,7);c.arc(w*.6,h*.39,unitsize*.55,0,7);c.fill();
      c.fillStyle="#d43d3d";c.fillRect(w*.22,0,w*.56,h*.1);
      c.fillStyle="#d1d1d1";c.beginPath();c.moveTo(w*.25,h*.82);c.lineTo(w*.5,h);c.lineTo(w*.75,h*.82);c.fill();
    }

    var originalSetThingSprite=window.setThingSprite;
    window.setThingSprite=function(t){
      if(t && (t.player || t.title==="Paji")) return paji(t);
      if(t && t.title==="Koopa") return notebook(t);
      if(t && t.title==="Bowser") return pencil(t);
      return originalSetThingSprite(t);
    };

    var originalPlacePlayer=window.placePlayer;
    if(typeof originalPlacePlayer==="function"){
      window.placePlayer=function(x,y){
        var result=originalPlacePlayer.apply(this,arguments);
        if(window.player){
          window.player.title="Paji";
          window.setThingSprite(window.player);
        }
        return result;
      };
    }

    function boot(){
      if(window.__pajiBooted)return;
      window.__pajiBooted=true;
      var bootEl=document.getElementById("pajiBoot");
      try{
        if(typeof window.FullScreenMario!=="function") throw new Error("FullScreenMario is missing");
        window.FullScreenMario();
        if(bootEl)bootEl.style.display="none";
      }catch(err){
        console.error("Paji Mario boot error:",err);
        if(bootEl){
          bootEl.className="error";
          bootEl.textContent="PAJI MARIO ERROR — "+String(err && err.message || err);
        }
      }
    }

    function bind(id,downCode,upCode){
      var el=document.getElementById(id);
      if(!el)return;
      var down=function(e){e.preventDefault();window.keydown(downCode);};
      var up=function(e){e.preventDefault();window.keyup(upCode);};
      ["pointerup","pointercancel","pointerleave"].forEach(function(name){el.addEventListener(name,up,{passive:false});});
      el.addEventListener("pointerdown",down,{passive:false});
    }

    document.addEventListener("DOMContentLoaded",function(){
      bind("pajiLeft",37,37);
      bind("pajiRight",39,39);
      bind("pajiRun",16,16);
      bind("pajiJump",38,38);
      boot();
    });
    face.addEventListener("load",function(){
      if(window.player && window.player.title==="Paji") window.setThingSprite(window.player);
    });
  })();
  </script>
</head>
<body>
  <div id="pajiTitle">PAJI MARIO</div>
  <div id="pajiBoot">LOADING PAJI MARIO...</div>
  <div id="pajiMenu">
    <button type="button" onclick="setMapRandom()">RANDOM WORLD</button>
    <button type="button" onclick="loadEditor()">LEVEL EDITOR</button>
    <button type="button" onclick="toggleAutoRespawn(this)">REVIVE</button>
    <button id="pajiFullscreen" type="button" aria-label="Toggle fullscreen">FULL</button>
  </div>
  <div id="pajiMobileControls" aria-label="Mobile controls">
    <div class="pajiPad">
      <button id="pajiLeft" class="pajiBtn" aria-label="Move left">◀</button>
      <button id="pajiRight" class="pajiBtn" aria-label="Move right">▶</button>
    </div>
    <div class="pajiPad">
      <button id="pajiRun" class="pajiBtn" aria-label="Run">⚡</button>
      <button id="pajiJump" class="pajiBtn" aria-label="Jump">▲</button>
    </div>
  </div>
</body>
</html>
