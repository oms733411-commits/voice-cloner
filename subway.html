<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Malab Subway Runner</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10131b;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#fff}
body{display:grid;place-items:center}#game{position:relative;width:min(430px,100vw);height:min(760px,100svh);overflow:hidden;background:linear-gradient(#6fd7ff 0 38%,#6f8d54 38% 48%,#363b43 48% 100%);touch-action:none;user-select:none}
#sky{position:absolute;inset:0;background:linear-gradient(#69d5ff,#d8f4ff 43%,#8eb16d 43%,#607a50 48%,#252a31 48% 100%)}
.cloud{position:absolute;width:110px;height:28px;background:#fff9;border-radius:30px;filter:blur(.3px)}.c1{top:13%;left:8%}.c2{top:23%;right:8%;transform:scale(.75)}
#city{position:absolute;bottom:49%;left:-10%;width:120%;height:130px;background:repeating-linear-gradient(90deg,#53677b 0 28px,#334352 28px 62px,#66798a 62px 82px);clip-path:polygon(0 40%,8% 40%,8% 10%,17% 10%,17% 34%,25% 34%,25% 0,34% 0,34% 28%,43% 28%,43% 12%,52% 12%,52% 36%,62% 36%,62% 4%,72% 4%,72% 25%,82% 25%,82% 8%,91% 8%,91% 38%,100% 38%,100% 100%,0 100%);opacity:.75}
#track{position:absolute;inset:48% 0 0;background:linear-gradient(90deg,#20242a,#41474f 50%,#20242a);clip-path:polygon(31% 0,69% 0,100% 100%,0 100%);z-index:1}
.rail{position:absolute;top:48%;bottom:0;width:6px;background:#aeb6bd;z-index:2;transform-origin:top}.r1{left:35%;transform:skewX(10deg)}.r2{left:50%;}.r3{left:65%;transform:skewX(-10deg)}
.sleeper{position:absolute;left:15%;width:70%;height:10px;background:#15191e;border-radius:3px;z-index:2}
#obstacles{position:absolute;inset:0;z-index:6}.barrier{position:absolute;width:74px;height:82px;background:linear-gradient(90deg,#f5c329 0 22%,#e84a32 22% 48%,#f5c329 48% 70%,#e84a32 70%);border:4px solid #252525;border-radius:8px;box-shadow:0 7px 0 #0005}.barrier:after{content:"";position:absolute;left:9px;right:9px;top:19px;height:10px;background:#fff}.train{position:absolute;width:92px;height:170px;background:linear-gradient(90deg,#db3030,#f3e6d0 18% 82%,#db3030);border:5px solid #252525;border-radius:13px 13px 5px 5px;box-shadow:0 8px 0 #0006}.train:before{content:"";position:absolute;left:13px;right:13px;top:18px;height:54px;background:#1d354a;border:4px solid #111;border-radius:7px}.train:after{content:"";position:absolute;left:14px;right:14px;bottom:13px;height:13px;background:#222;border-radius:5px}
#player{position:absolute;width:72px;height:90px;left:calc(50% - 36px);bottom:18%;z-index:10;transition:left .12s,transform .12s}
#player img{width:72px;height:72px;object-fit:contain;display:block;filter:drop-shadow(0 5px 3px #0008);border-radius:0}
#body{position:absolute;left:20px;top:54px;width:32px;height:30px;background:#1769b0;border-radius:10px 10px 5px 5px;border:3px solid #0c3150}
#hud{position:absolute;top:14px;left:0;width:100%;z-index:20;text-align:center;font-size:36px;font-weight:950;text-shadow:0 3px #17202a}.coinHud{position:absolute;top:15px;right:12px;z-index:20;background:#0007;padding:8px 12px;border-radius:12px;font-weight:900}
#overlay{position:absolute;inset:0;z-index:30;display:grid;place-items:center;background:#07101d66}.card{width:min(350px,88%);padding:25px 22px;text-align:center;border-radius:22px;background:#101827ed;border:1px solid #fff2;box-shadow:0 18px 55px #0009}.card h1{margin:0 0 8px;font-size:34px}.card p{color:#cbd5e1}.btn{border:0;border-radius:13px;padding:13px 24px;background:#ffd438;color:#322600;font-size:17px;font-weight:950}
#flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:25;pointer-events:none}
@keyframes bob{50%{transform:translateY(-4px)}}#player{animation:bob .42s ease-in-out infinite}
</style>
</head>
<body>
<div id="game">
<div id="sky"></div><div class="cloud c1"></div><div class="cloud c2"></div><div id="city"></div><div id="track"></div>
<div class="rail r1"></div><div class="rail r2"></div><div class="rail r3"></div><div id="sleepers"></div><div id="obstacles"></div>
<div id="player"><img src="malab-face.jpg?v=5" alt="Malab"><div id="body"></div></div>
<div id="hud">0</div><div class="coinHud">🪙 <span id="coins">0</span></div><div id="flash"></div>
<div id="overlay"><div class="card"><h1>Malab Subway Runner</h1><p>Swipe left/right to change lanes. Swipe up to jump.</p><button class="btn" id="start">RUN</button></div></div>
</div>
<script>
(()=>{const g=document.getElementById('game'),p=document.getElementById('player'),obs=document.getElementById('obstacles'),hud=document.getElementById('hud'),coinsEl=document.getElementById('coins'),overlay=document.getElementById('overlay'),flash=document.getElementById('flash');let lane=1,y=0,vy=0,score=0,coins=0,running=false,last=0,spawn=0,items=[],raf=0;const W=()=>g.clientWidth,H=()=>g.clientHeight;function laneX(l,w=72){return [W()*.22-w/2,W()*.5-w/2,W()*.78-w/2][l]}function setLane(){p.style.left=laneX(lane)+'px'}function jump(){if(!running)return;if(y===0)vy=-690}function start(){items.forEach(o=>o.el.remove());items=[];lane=1;y=0;vy=0;score=0;coins=0;hud.textContent=0;coinsEl.textContent=0;setLane();p.style.bottom='18%';overlay.style.display='none';running=true;last=performance.now();raf=requestAnimationFrame(loop)}function spawnItem(){const l=Math.floor(Math.random()*3),type=Math.random()<.34?'train':'barrier',el=document.createElement('div');el.className=type;const w=type==='train'?92:74;el.style.left=laneX(l,w)+'px';el.style.top='-190px';obs.appendChild(el);items.push({el,l,y:-190,type,passed:false})}function hit(o){const px=laneX(lane),py=H()*.82-y;const ow=o.type==='train'?92:74,oh=o.type==='train'?170:82,ox=laneX(o.l,ow),oy=o.y;if(px+56<ox||px+16>ox+ow)return false;return py-70<oy+oh&&py>oy}function end(){running=false;cancelAnimationFrame(raf);flash.style.opacity=.65;setTimeout(()=>flash.style.opacity=0,90);overlay.style.display='grid';overlay.querySelector('.card').innerHTML='<h1>Game Over 💥</h1><p>Score: <b>'+score+'</b> &nbsp; 🪙 '+coins+'</p><button class="btn" id="again">RUN AGAIN</button>';document.getElementById('again').onclick=start}function loop(t){if(!running)return;const dt=Math.min(.032,(t-last)/1000);last=t;vy+=1700*dt;y+=vy*dt;if(y<0)y=0;if(y===0)vy=0;p.style.bottom=(18+(y/H()*100))+'%';spawn-=dt;if(spawn<=0){spawnItem();spawn=Math.max(.48,.85-score*.003)}const speed=300+Math.min(250,score*3);for(const o of items){o.y+=speed*dt;o.el.style.top=o.y+'px';if(!o.passed&&o.y>H()*.82){o.passed=true;score++;hud.textContent=score;if(Math.random()<.35){coins++;coinsEl.textContent=coins}}if(hit(o))return end()}items=items.filter(o=>{if(o.y>H()+210){o.el.remove();return false}return true});raf=requestAnimationFrame(loop)}let sx=0,sy=0;g.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});g.addEventListener('pointerup',e=>{if(!running)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<25)return;if(Math.abs(dx)>Math.abs(dy)){lane=Math.max(0,Math.min(2,lane+(dx>0?1:-1)));setLane()}else if(dy<0)jump()});document.addEventListener('keydown',e=>{if(e.code==='ArrowLeft'){lane=Math.max(0,lane-1);setLane()}else if(e.code==='ArrowRight'){lane=Math.min(2,lane+1);setLane()}else if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();jump()}});document.getElementById('start').onclick=start;setLane();for(let i=0;i<7;i++){const s=document.createElement('div');s.className='sleeper';s.style.top=(50+i*8)+'%';s.style.transform='perspective(100px) rotateX(35deg)';document.getElementById('sleepers').appendChild(s)}})();
</script>
</body>
</html>
