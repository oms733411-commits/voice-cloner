<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Malabrio</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101828;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
body{display:grid;place-items:center}#wrap{position:relative;width:min(960px,100vw);height:min(600px,100svh);overflow:hidden;background:#69cfff;touch-action:none}
canvas{width:100%;height:100%;display:block;image-rendering:auto}
#hud{position:absolute;top:12px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:center;z-index:5;color:#fff;font-weight:900;text-shadow:0 2px 3px #000;font-size:17px;pointer-events:none;gap:8px}.hudbox{min-width:150px;text-align:center;backdrop-filter:blur(7px);box-shadow:0 6px 20px #0005}
.hudbox{background:#07101db8;border:1px solid #fff3;border-radius:14px;padding:8px 11px}
#overlay{position:absolute;inset:0;z-index:10;display:grid;place-items:center;background:#07101d88}
.card{width:min(470px,90%);padding:22px 22px;text-align:center;transform:translateY(-55px);border-radius:22px;background:#111a2bed;color:#fff;border:1px solid #fff2;box-shadow:0 20px 70px #000b}
.card h1{margin:0 0 8px;font-size:48px}.card p{color:#d6dfed;line-height:1.5}
button{border:0;border-radius:16px;padding:15px 30px;background:#ffd438;color:#322600;font-size:19px;font-weight:950;cursor:pointer;box-shadow:0 8px 20px #0005;transition:transform .12s,box-shadow .12s}button:hover{transform:translateY(-2px);box-shadow:0 11px 24px #0006}button:active{transform:translateY(1px);box-shadow:0 5px 12px #0005}
#touch{position:absolute;bottom:12px;left:12px;right:12px;display:flex;justify-content:space-between;z-index:7;pointer-events:none}
.pad{display:flex;gap:9px}.touchbtn{pointer-events:auto;width:54px;height:54px;border:1px solid #fff4;border-radius:50%;background:#111a2db8;color:#fff;font-size:23px;font-weight:900}
#tip{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);z-index:4;color:#fff;background:#07101d99;border:1px solid #fff2;backdrop-filter:blur(5px);border-radius:12px;padding:7px 11px;font-size:12px;pointer-events:none;white-space:nowrap}
</style>
</head>
<body>
<div id="wrap">
<canvas id="game"></canvas>
<div id="hud">
 <div class="hudbox">🍄 <span id="size">SMALL</span> &nbsp; 🪙 <span id="coin">0</span></div>
 <div class="hudbox">WORLD <span id="world">1-1</span> &nbsp; ❤️ <span id="lives">3</span></div>
 <div class="hudbox">⭐ <span id="score">0</span></div>
</div>
<div id="tip">← → move • Space/↑ jump • collect 🍄 to grow • reach the flag</div>
<div id="touch"><div class="pad"><button class="touchbtn" id="left">◀</button><button class="touchbtn" id="right">▶</button></div><button class="touchbtn" id="jump">▲</button></div>
<div id="overlay"><div class="card"><h1>Malabrio</h1><p>A classic side-scrolling platform adventure with your face as the hero.<br>Collect coins and mushrooms, defeat notebook enemies, avoid pencil bosses, and unlock the underground world.</p><button id="start">START ADVENTURE</button></div></div>
</div>
<script>
(()=> {
const c=document.getElementById('game'),x=c.getContext('2d'),wrap=document.getElementById('wrap');
const face=new Image(); face.src='malab-face.jpg?v=7';
let W=960,H=600,scale=1,keys={},running=false,level=0,lives=3,coins=0,score=0,big=false,inv=0,cam=0,targetCam=0,last=0,raf=0,levelDone=false,coyote=0,jumpBuffer=0,shake=0;let particles=[];let audioCtx=null;
const worlds=[
 {name:'1-1',underground:false,bg:'#6fd8ff',ground:'#6dba45',length:6500,flag:6250,theme:'surface'},
 {name:'1-2',underground:true,bg:'#17182c',ground:'#3a304a',length:7200,flag:6950,theme:'underground'}
];
let player,blocks,enemies,pickups,flag,boss;
function resize(){const r=wrap.getBoundingClientRect();W=960;H=600;c.width=W;c.height=H;scale=Math.min(r.width/W,r.height/H)}resize();addEventListener('resize',resize);
function resetLevel(){
 const w=worlds[level]; cam=0;levelDone=false;inv=0;big=false;
 player={x:120,y:420,vx:0,vy:0,w:44,h:64,on:false};
 blocks=[];enemies=[];pickups=[];flag={x:w.flag,y:0};
 const add=(X,Y,WW=220,HH=35)=>blocks.push({x:X,y:Y,w:WW,h:HH});
 // ground segments with gaps
 for(let i=0;i<w.length;i+=300)add(i,535,270,65);
 // platforms
 const plats=level===0?[[520,430,150],[820,360,140],[1150,445,190],[1500,385,170],[1870,325,150],[2240,420,190],[2700,365,170],[3100,445,220],[3520,350,180],[3950,410,190],[4380,330,170],[4820,420,210],[5280,365,180],[5700,440,200]]:[[450,410,170],[780,340,160],[1110,430,180],[1470,350,190],[1850,400,160],[2200,300,190],[2600,420,180],[3000,345,200],[3450,400,170],[3900,300,180],[4350,385,190],[4800,320,180],[5250,410,200],[5750,350,180],[6250,420,190]];
 plats.forEach(a=>add(a[0],a[1],a[2],30));
 // question-style blocks
 const qs=level===0?[700,900,1260,1590,2310,2780,3660,4460,5380]:[580,980,1510,2280,3150,4000,4920,5880];
 qs.forEach((q,i)=>pickups.push({type:'coin',x:q,y:260+(i%3)*35,t:0}));
 // mushrooms
 [1080,2000,3250,4700,5500].forEach((q,i)=>pickups.push({type:'mushroom',x:q,y:495-(i%2)*70,t:0}));
 // coins arcs
 for(let q=300;q<w.length-400;q+=520)for(let j=0;j<4;j++)pickups.push({type:'coin',x:q+j*42,y:390-Math.sin(j/3*Math.PI)*75,t:0});
 // notebook enemies
 const es=level===0?[1000,1750,2450,3000,3820,4300,5100,5900]:[900,1350,2000,2750,3350,4100,4650,5350,6100];
 es.forEach((q,i)=>enemies.push({type:'notebook',x:q,y:480,w:48,h:55,vx:(i%2? -45:45),alive:true}));
 // pencils, stronger enemies
 const ps=level===0?[3450,5550]:[1700,3600,5000,6400];
 ps.forEach(q=>enemies.push({type:'pencil',x:q,y:455,w:70,h:80,vx:q%2?35:-35,alive:true}));
 flag.y=390;
}
function beep(freq,dur=.07,type='square'){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.045,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur)}catch(e){}}function burst(px,py,n=8){for(let i=0;i<n;i++)particles.push({x:px,y:py,vx:(Math.random()-.5)*220,vy:(Math.random()-.8)*220,life:.45+Math.random()*.35,size:2+Math.random()*5})}function start(){beep(520,.09);level=0;lives=3;coins=0;score=0;particles=[];running=true;document.getElementById('overlay').style.display='none';resetLevel();last=performance.now();raf=requestAnimationFrame(loop)}
function worldTransition(){
 running=false;level++;
 if(level>=worlds.length){document.getElementById('overlay').innerHTML='<div class="card"><h1>🏆 Malabrio!</h1><p>You completed both worlds.<br>Coins: <b>'+coins+'</b> &nbsp; Score: <b>'+score+'</b></p><button id="again">PLAY AGAIN</button></div>';document.getElementById('overlay').style.display='grid';document.getElementById('again').onclick=start;return}
 document.getElementById('overlay').innerHTML='<div class="card"><h1>WORLD 1-2</h1><p>Underground unlocked! 🌑<br>The tunnels are darker and the pencil enemies are tougher.</p><button id="next">ENTER UNDERGROUND</button></div>';document.getElementById('overlay').style.display='grid';document.getElementById('next').onclick=()=>{document.getElementById('overlay').style.display='none';resetLevel();running=true;last=performance.now();raf=requestAnimationFrame(loop)}
}
function hurt(){
 if(inv>0)return; lives--;document.getElementById('lives').textContent=lives;inv=1.5;
 if(big){big=false;player.h=64;player.y-=30;return}
 if(lives<=0){running=false;document.getElementById('overlay').innerHTML='<div class="card"><h1>Game Over 💥</h1><p>Score: <b>'+score+'</b> &nbsp; 🪙 '+coins+'</p><button id="retry">TRY AGAIN</button></div>';document.getElementById('overlay').style.display='grid';document.getElementById('retry').onclick=start}
 else {player.x=120;player.y=420;player.vx=0;player.vy=0;cam=0}
}
function jump(){if(!running)return;jumpBuffer=.14;if(player.on||coyote>0){player.vy=-735;player.on=false;coyote=0;jumpBuffer=0;beep(420,.06)}}
function move(dt){
 coyote=player.on?.09:Math.max(0,coyote-dt);jumpBuffer=Math.max(0,jumpBuffer-dt);
 const acc=1900,fr=1350,max=350;
 if(keys.left)player.vx-=acc*dt;if(keys.right)player.vx+=acc*dt;
 if(!keys.left&&!keys.right){if(player.vx>0)player.vx=Math.max(0,player.vx-fr*dt);if(player.vx<0)player.vx=Math.min(0,player.vx+fr*dt)}
 player.vx=Math.max(-max,Math.min(max,player.vx));player.x+=player.vx*dt;
 if(jumpBuffer>0&&(player.on||coyote>0)){player.vy=-735;player.on=false;coyote=0;jumpBuffer=0;beep(420,.06)}player.vy+=1900*dt;player.y+=player.vy*dt;player.on=false;
 // platforms/ground
 for(const b of blocks){if(player.x+player.w>b.x&&player.x<b.x+b.w&&player.y+player.h<=b.y+18&&player.y+player.h+player.vy*dt>=b.y){player.y=b.y-player.h;player.vy=0;player.on=true}}
 if(player.y>H+120){burst(player.x,520,14);shake=.35;beep(110,.12,'sawtooth');hurt();player.y=420;player.vy=0}
 if(player.x<0)player.x=0;
}
function hit(a,b){return a.x<a.x+a.w&&a.x+a.w>b.x&&a.y<a.y+a.h&&a.y+a.h>b.y}
function update(dt){
 move(dt);inv=Math.max(0,inv-dt);shake=Math.max(0,shake-dt);
 for(const p of pickups){p.t+=dt;if(p.type==='coin'&&!p.got&&Math.abs(player.x-p.x)<40&&Math.abs(player.y-p.y)<60){p.got=true;coins++;score+=100;burst(p.x,p.y,7);shake=.08;beep(880,.045)}}
 for(const p of pickups){if(p.type==='mushroom'&&!p.got&&Math.abs(player.x-p.x)<42&&Math.abs(player.y-p.y)<55){p.got=true;big=true;player.h=78;player.y-=14;score+=500;burst(p.x,p.y,16);beep(660,.12,'triangle')}}
 for(const e of enemies){if(!e.alive)continue;e.x+=e.vx*dt;const near={x:e.x,y:e.y,w:e.w,h:e.h};if(e.x<80||e.x>worlds[level].length-100)e.vx*=-1;
   if(hit(player,near)){if(player.vy>150&&player.y+player.h<e.y+35){e.alive=false;player.vy=-500;score+=e.type==='pencil'?1000:250;burst(e.x+e.w/2,e.y+e.h/2,14);shake=.18;beep(e.type==='pencil'?180:250,.08,'square')}else{shake=.28;beep(90,.14,'sawtooth');hurt()}}
 }
 if(player.x>flag.x){score+=2000;worldTransition();return}
 targetCam=Math.max(0,Math.min(worlds[level].length-W,player.x-300));cam+=(targetCam-cam)*Math.min(1,dt*7);
 document.getElementById('coin').textContent=coins;document.getElementById('score').textContent=score;document.getElementById('world').textContent=worlds[level].name;document.getElementById('size').textContent=big?'BIG':'SMALL';
}
function draw(){
 const w=worlds[level];x.clearRect(0,0,W,H);x.save();if(shake>0)x.translate((Math.random()-.5)*10*shake,(Math.random()-.5)*7*shake);
 x.fillStyle=w.bg;x.fillRect(0,0,W,H);
 if(!w.underground){ // sky decorations
  x.fillStyle='#fff8';for(let i=0;i<9;i++){let xx=(i*430-cam*.18)%1200;x.beginPath();x.arc(xx,105+(i%3)*38,28,0,7);x.arc(xx+32,110+(i%3)*38,36,0,7);x.arc(xx+68,105+(i%3)*38,25,0,7);x.fill()}
  x.fillStyle='#63a653';for(let i=0;i<14;i++){let xx=(i*180-cam*.35)%1200;x.fillRect(xx,430-(i%2)*25,70,105)}
 }else{ // underground ceiling
  x.fillStyle='#27233d';for(let i=0;i<25;i++){let xx=(i*90-cam*.3)%1100;x.beginPath();x.moveTo(xx,0);x.lineTo(xx+45,0);x.lineTo(xx+22,70+(i%4)*25);x.closePath();x.fill()}
  x.fillStyle='#4d3b63';for(let i=0;i<18;i++){let xx=(i*130-cam*.5)%1100;x.beginPath();x.arc(xx,460-(i%3)*30,55,0,7);x.fill()}
 }
 x.save();x.translate(-cam,0);
 // distant parallax silhouettes
 x.fillStyle=w.underground?'#201c32':'#4f9cc7';for(let i=0;i<18;i++){let xx=(i*170-cam*.18)%1200;if(xx<0)xx+=1200;x.beginPath();x.moveTo(xx,535);x.lineTo(xx+75,360-(i%4)*35);x.lineTo(xx+150,535);x.fill()}
 // blocks
 for(const b of blocks){x.fillStyle=w.underground?'#684e3b':'#9a6237';x.fillRect(b.x,b.y,b.w,b.h);x.fillStyle=w.underground?'#806047':'#b87842';x.fillRect(b.x+3,b.y+3,b.w-6,6);x.strokeStyle='#4a2c1b';x.lineWidth=3;x.strokeRect(b.x,b.y,b.w,b.h);if(b.h<50){for(let q=b.x+25;q<b.x+b.w;q+=45){x.fillStyle='#d18b4c';x.fillRect(q,b.y+8,22,7)}}}
 // pickups
 for(const p of pickups)if(!p.got){if(p.type==='coin'){x.fillStyle='#ffd43b';x.beginPath();x.arc(p.x,p.y+Math.sin(p.t*5)*5,14,0,7);x.fill();x.strokeStyle='#a76a00';x.lineWidth=3;x.stroke();x.fillStyle='#fff5a6';x.fillRect(p.x-3,p.y-9,5,12)}
 else {x.fillStyle='#e94b3c';x.beginPath();x.arc(p.x-10,p.y,14,Math.PI,0);x.arc(p.x+10,p.y,14,Math.PI,0);x.fill();x.fillStyle='#fff1d0';x.fillRect(p.x-20,p.y,p.w||40,25);x.fillStyle='#333';x.fillRect(p.x-12,p.y+13,8,7);x.fillRect(p.x+4,p.y+13,8,7)}}
 // enemies
 for(const e of enemies)if(e.alive){if(e.type==='notebook'){x.fillStyle='#f3efe1';x.fillRect(e.x,e.y,e.w,e.h);x.strokeStyle='#222';x.lineWidth=4;x.strokeRect(e.x,e.y,e.w,e.h);x.fillStyle='#4a8ad0';for(let q=9;q<e.h-5;q+=12)x.fillRect(e.x+8,e.y+q,e.w-16,2);x.fillStyle='#d33';x.fillRect(e.x+7,e.y,3,e.h);x.fillStyle='#111';x.beginPath();x.arc(e.x+16,e.y+18,4,0,7);x.arc(e.x+33,e.y+18,4,0,7);x.fill();x.fillStyle='#222';x.fillRect(e.x+17,e.y+37,17,4)}
 else {x.fillStyle='#e8b02b';x.fillRect(e.x+22,e.y,e.w-44,e.h);x.fillStyle='#f3e5c7';x.fillRect(e.x+12,e.y+13,e.w-24,48);x.strokeStyle='#222';x.lineWidth=4;x.strokeRect(e.x+12,e.y+13,e.w-24,48);x.fillStyle='#111';x.beginPath();x.arc(e.x+29,e.y+34,5,0,7);x.arc(e.x+42,e.y+34,5,0,7);x.fill();x.fillStyle='#d33';x.fillRect(e.x+2,e.y+2,10,e.h-4)}}
 // particles
 for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx*.016;p.y+=p.vy*.016;p.vy+=420*.016;p.life-=.016;x.globalAlpha=Math.max(0,p.life*1.5);x.fillStyle='#fff1a8';x.fillRect(p.x,p.y,p.size,p.size);if(p.life<=0)particles.splice(i,1)}x.globalAlpha=1;
 // flag
 x.fillStyle='#222';x.fillRect(flag.x,flag.y,8,145);x.fillStyle='#42d66b';x.beginPath();x.moveTo(flag.x+8,flag.y+5);x.lineTo(flag.x+80,flag.y+28);x.lineTo(flag.x+8,flag.y+50);x.closePath();x.fill();
 // player
 if(!(inv>0&&Math.floor(inv*12)%2===0)){let pw=big?50:44,ph=big?78:64;const px=player.x,py=player.y; x.save();x.beginPath();x.arc(px+pw/2,py+27,25,0,7);x.clip();x.drawImage(face,px,py, pw,ph*.72);x.restore();
  x.fillStyle='#1769b0';x.fillRect(px+7,py+ph*.58,pw-14,ph*.35);x.fillStyle='#111';x.fillRect(px+5,py+ph-6,15,8);x.fillRect(px+pw-20,py+ph-6,15,8);
 }
 x.restore();x.restore();
}
function loop(t){if(!running)return;const dt=Math.min(.033,(t-last)/1000);last=t;update(dt);draw();raf=requestAnimationFrame(loop)}
function bind(id,key){const b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();keys[key]=true});b.addEventListener('pointerup',()=>keys[key]=false);b.addEventListener('pointercancel',()=>keys[key]=false);b.addEventListener('pointerleave',()=>keys[key]=false)}
bind('left','left');bind('right','right');document.getElementById('jump').addEventListener('pointerdown',e=>{e.preventDefault();jump()});
addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','Space'].includes(e.code))e.preventDefault();if(e.code==='ArrowLeft'||e.code==='KeyA')keys.left=true;if(e.code==='ArrowRight'||e.code==='KeyD')keys.right=true;if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW')jump()});
addEventListener('keyup',e=>{if(e.code==='ArrowLeft'||e.code==='KeyA')keys.left=false;if(e.code==='ArrowRight'||e.code==='KeyD')keys.right=false});
document.getElementById('start').onclick=start;resetLevel();draw();
})();
</script>
</body>
</html>
