<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bird Blast — 50 Level Physics Game</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#101827;color:#fff;overflow-x:hidden}
body{display:flex;justify-content:center}.app{width:min(1180px,100%);padding:12px}
.top{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap}
.brand{font-weight:900;font-size:clamp(20px,4vw,32px);letter-spacing:-.04em}.brand span{opacity:.55;font-size:.55em;font-weight:700;margin-left:8px}
.actions{display:flex;gap:7px;flex-wrap:wrap}.btn{border:1px solid #31415c;background:#182238;color:#fff;border-radius:12px;padding:9px 13px;font-weight:800;cursor:pointer;touch-action:manipulation}.btn:hover{background:#21304b}.btn:disabled{opacity:.4;cursor:not-allowed}
.hud{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;background:#151f33;border:1px solid #2a3852;border-radius:15px;padding:8px 12px;margin-bottom:9px}
.stat{font-weight:800}.center{text-align:center}.right{text-align:right}
canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;background:#8bd3ff;border-radius:18px;border:1px solid #31415c;box-shadow:0 16px 45px #0006;touch-action:none}
.hint{margin:9px 2px 0;color:#aebbd0;font-size:13px;text-align:center}
.levels{display:none;margin-top:10px;background:#151f33;border:1px solid #2a3852;border-radius:15px;padding:12px}.levels.open{display:block}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:7px}.lv{min-height:48px;border-radius:11px;border:1px solid #33445f;background:#1b2940;color:#fff;font-weight:900;cursor:pointer}.lv.locked{opacity:.35}.lv.done{outline:2px solid #f7c948}.lv small{display:block;font-size:9px;opacity:.7}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:18px;z-index:5}.modal.show{display:flex}.card{width:min(470px,100%);background:#141e31;border:1px solid #34435d;border-radius:20px;padding:24px;text-align:center;box-shadow:0 20px 70px #000b}.card h2{margin:0 0 8px;font-size:32px}.stars{font-size:42px;letter-spacing:4px;margin:8px 0}.card p{color:#b6c2d5}.card .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}
@media(max-width:650px){.hud{grid-template-columns:1fr 1fr}.center{display:none}.right{text-align:right}.app{padding:7px}.btn{padding:8px 10px}.hint{font-size:12px}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand">🐦 Bird Blast <span>50 LEVEL PHYSICS</span></div>
    <div class="actions">
      <button class="btn" id="levelsBtn">Levels</button>
      <button class="btn" id="restartBtn">Restart</button>
      <button class="btn" id="pauseBtn">Pause</button>
    </div>
  </div>
  <div class="hud">
    <div class="stat">Level <b id="levelNo">1</b> · Pigs <b id="pigNo">0</b></div>
    <div class="center stat" id="message">Drag the bird back</div>
    <div class="right stat">Score <b id="score">0</b></div>
  </div>
  <canvas id="game" width="1280" height="720" aria-label="Bird Blast game"></canvas>
  <div class="hint">Drag from the slingshot and release. Tap/click a flying bird to activate its ability. Keyboard: R restart · P pause · L levels.</div>
  <div class="levels" id="levelsPanel"><div class="grid" id="levelGrid"></div></div>
</div>
<div class="modal" id="modal">
  <div class="card">
    <h2 id="modalTitle">Level Complete!</h2>
    <div class="stars" id="modalStars">★★★</div>
    <p id="modalText">Score 0</p>
    <div class="row">
      <button class="btn" id="againBtn">Replay</button>
      <button class="btn" id="nextBtn">Next level</button>
      <button class="btn" id="closeBtn">Close</button>
    </div>
  </div>
</div>
<script>
(() => {
'use strict';
const c=document.getElementById('game'),ctx=c.getContext('2d');
const W=1280,H=720,G=570,SL={x:185,y:500},TAU=Math.PI*2;
const ui={level:document.getElementById('levelNo'),pigs:document.getElementById('pigNo'),score:document.getElementById('score'),msg:document.getElementById('message'),levels:document.getElementById('levelsPanel'),grid:document.getElementById('levelGrid'),modal:document.getElementById('modal'),modalTitle:document.getElementById('modalTitle'),modalStars:document.getElementById('modalStars'),modalText:document.getElementById('modalText')};
let level=1,score=0,paused=false,over=false,dragging=false,aim={x:SL.x,y:SL.y},birds=[],blocks=[],pigs=[],particles=[],camera=0,last=performance.now(),id=0;
const unlocked=Math.max(1,Number(localStorage.getItem('birdblast-unlocked')||1));
const best=JSON.parse(localStorage.getItem('birdblast-best')||'{}');
function save(){localStorage.setItem('birdblast-unlocked',String(Math.max(unlocked,level+1)));localStorage.setItem('birdblast-best',JSON.stringify(best))}
function rnd(a,b){return a+Math.random()*(b-a)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function matColor(m){return m==='wood'?'#9a6239':m==='ice'?'#aee8ff':'#777f91'}
function addBlock(x,y,w,h,m='wood',rot=0,hp){blocks.push({x,y,w,h,m,rot,hp:hp??(m==='stone'?150:m==='ice'?55:85),dead:false})}
function addPig(x,y,r=22){pigs.push({x,y,r,hp:55,dead:false,hit:0})}
function addBird(type,x=SL.x,y=SL.y){birds.push({type,x,y,r:22,vx:0,vy:0,state:'ready',used:false,trail:[]})}
function clearWorld(){birds=[];blocks=[];pigs=[];particles=[];score=0;over=false;paused=false}
function tower(x,y,rows,material,width=70){
 for(let i=0;i<rows;i++){addBlock(x,y-i*48,width,26,material,0)}
}
function arch(x,y,material,width=170){
 addBlock(x-width/2,y,28,100,material);addBlock(x+width/2,y,28,100,material);addBlock(x,y-100,width+28,28,material)
}
function buildLevel(n){
 clearWorld();
 const d=Math.floor((n-1)/10), pattern=(n-1)%10;
 const mats=d===0?['wood']:d===1?['wood','ice']:d===2?['wood','ice','stone']:d===3?['wood','ice','stone']:['ice','stone','wood'];
 const baseY=G;
 const x1=760+pattern*12, x2=1010+((pattern*37)%80);
 if(pattern%3===0){tower(x1,baseY-13,2+d,mats[(n+1)%mats.length]);addPig(x1,baseY-55);arch(x2,baseY-10,mats[n%mats.length],150);addPig(x2,baseY-125)}
 else if(pattern%3===1){arch(x1,baseY-10,mats[n%mats.length],160);addPig(x1,baseY-135);tower(x2,baseY-13,2+d,mats[(n+2)%mats.length]);addPig(x2,baseY-55)}
 else {tower(x1,baseY-13,2+d,mats[0]);tower(x2,baseY-13,2+d,mats[1%mats.length]);addPig(x1,baseY-55);addPig(x2,baseY-55)}
 if(d>=1){addBlock((x1+x2)/2,baseY-175,150,24,mats[(n+2)%mats.length]);addPig((x1+x2)/2,baseY-205)}
 if(d>=2){addBlock(x1+70,baseY-265,120,24,'stone');addPig(x1+70,baseY-295)}
 if(d>=3 && pattern%2===0){addBlock(x2-65,baseY-265,120,24,'ice');addPig(x2-65,baseY-295)}
 if(d>=4){addBlock((x1+x2)/2,baseY-335,170,26,'stone');addPig((x1+x2)/2,baseY-365)}
 const birdCount=3+(n%3);
 addBird('red');if(birdCount>=2)addBird('yellow');if(birdCount>=3)addBird(n%2?'blue':'black');if(birdCount>=4)addBird('yellow');if(birdCount>=5)addBird('black');
 ui.level.textContent=n;ui.score.textContent=score;ui.pigs.textContent=pigs.length;ui.msg.textContent='Drag the bird back';
 renderLevels();
}
function nextBird(){return birds.find(b=>b.state==='ready')}
function launch(b,x,y){
 const dx=SL.x-x,dy=SL.y-y,mag=clamp(Math.hypot(dx,dy),0,150),power=1.0;
 b.state='fly';b.x=SL.x;b.y=SL.y;b.vx=dx*0.105*power;b.vy=dy*0.105*power;b.launchT=performance.now();b.trail=[];dragging=false;ui.msg.textContent='Tap the bird for its ability'; 
}
function activate(b){
 if(b.state!=='fly'||b.used)return;b.used=true;
 if(b.type==='yellow'){b.vx*=1.85;b.vy*=1.85;burst(b.x,b.y,18)}
 else if(b.type==='blue'){for(const k of [0.08,-0.08]){const q={...b,vx:b.vx*Math.cos(k)-b.vy*Math.sin(k),vy:b.vx*Math.sin(k)+b.vy*Math.cos(k),state:'fly',used:true,r:15};birds.push(q)};b.vx*=1.1;b.vy*=1.1;burst(b.x,b.y,16)}
 else if(b.type==='black'){burst(b.x,b.y,55);for(const p of pigs){if(!p.dead&&dist(b,p)<170)p.hp-=100}for(const k of blocks){if(!k.dead&&Math.hypot(k.x-b.x,k.y-b.y)<190)k.hp-=130}b.vx=0;b.vy=0;b.state='spent'}
 else {b.vx*=1.12;b.vy*=1.12;burst(b.x,b.y,12)}
}
function burst(x,y,n){
 for(let i=0;i<n;i++)particles.push({x,y,vx:rnd(-5,5),vy:rnd(-5,5),life:rnd(20,45),r:rnd(2,5)})
}
function hitCircleRect(b,k){
 const cs=Math.cos(-k.rot),sn=Math.sin(-k.rot),dx=b.x-k.x,dy=b.y-k.y;
 const lx=dx*cs-dy*sn,ly=dx*sn+dy*cs;const cx=clamp(lx,-k.w/2,k.w/2),cy=clamp(ly,-k.h/2,k.h/2);
 const ax=lx-cx,ay=ly-cy;return ax*ax+ay*ay<b.r*b.r;
}
function physics(dt){
 if(paused||over)return;
 for(const b of birds){
  if(b.state==='fly'){
   b.vy+=0.34*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.vx*=0.999;b.vy*=0.999;
   b.trail.push({x:b.x,y:b.y});if(b.trail.length>16)b.trail.shift();
   if(b.y+b.r>G){b.y=G-b.r;b.vy*=-0.32;b.vx*=0.72;if(Math.abs(b.vy)<1.1&&Math.abs(b.vx)<1.2)b.state='spent'}
   for(const k of blocks)if(!k.dead&&hitCircleRect(b,k)){const sp=Math.hypot(b.vx,b.vy);k.hp-=sp*7+5;b.vx*=-0.45;b.vy*=-0.45;b.x+=b.vx*0.25;b.y+=b.vy*0.25;burst(b.x,b.y,5)}
   for(const p of pigs)if(!p.dead&&dist(b,p)<b.r+p.r){p.hp-=Math.hypot(b.vx,b.vy)*8+15;b.vx*=-0.35;b.vy*=-0.35;burst(p.x,p.y,8)}
   if(b.x>W+300||b.y>H+250||b.x<-100)b.state='spent';
  }
 }
 for(const k of blocks){if(k.hp<=0&&!k.dead){k.dead=true;score+=100;burst(k.x,k.y,12)}}
 for(const p of pigs){if(p.hp<=0&&!p.dead){p.dead=true;score+=500;burst(p.x,p.y,22)}}
 blocks=blocks.filter(k=>!k.dead);pigs=pigs.filter(p=>!p.dead);
 particles.forEach(q=>{q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=0.16*dt;q.life-=dt});particles=particles.filter(q=>q.life>0);
 ui.score.textContent=Math.floor(score);ui.pigs.textContent=pigs.length;
 const active=birds.some(b=>b.state==='fly');
 if(pigs.length===0){complete();return}
 if(!active&&!nextBird()&&birds.every(b=>b.state==='spent'))fail();
}
function complete(){
 if(over)return;over=true;best[level]=Math.max(best[level]||0,score);localStorage.setItem('birdblast-best',JSON.stringify(best));localStorage.setItem('birdblast-unlocked',String(Math.max(Number(localStorage.getItem('birdblast-unlocked')||1),Math.min(50,level+1))));
 const stars=score>2500?'★★★':score>1200?'★★☆':'★☆☆';ui.modalTitle.textContent='Level Complete!';ui.modalStars.textContent=stars;ui.modalText.textContent='Level '+level+' · Score '+Math.floor(score);ui.modal.classList.add('show');renderLevels()
}
function fail(){
 if(over)return;over=true;ui.modalTitle.textContent='Try Again';ui.modalStars.textContent='';ui.modalText.textContent='The pigs survived. Restart and change your angle.';ui.modal.classList.add('show')
}
function load(n){level=clamp(n,1,50);ui.modal.classList.remove('show');buildLevel(level)}
function renderLevels(){
 const u=Math.max(1,Number(localStorage.getItem('birdblast-unlocked')||1));ui.grid.innerHTML='';
 for(let i=1;i<=50;i++){const b=document.createElement('button');b.className='lv'+(i<=u?'':' locked')+(best[i]?' done':'');b.innerHTML=i+(best[i]?'<small>★</small>':'');b.disabled=i>u;b.addEventListener('click',()=>load(i));ui.grid.appendChild(b)}
}
function resize(){const r=c.getBoundingClientRect();c.width=1280;c.height=720}
function pointer(e){
 const r=c.getBoundingClientRect(),sx=W/r.width,sy=H/r.height;return{x:(e.clientX-r.left)*sx,y:(e.clientY-r.top)*sy}
}
c.addEventListener('pointerdown',e=>{if(paused||over)return;const p=pointer(e),b=nextBird();if(b&&dist(p,SL)<55){dragging=true;aim={x:p.x,y:p.y};c.setPointerCapture(e.pointerId)}else{for(const q of birds)if(q.state==='fly'&&dist(p,q)<35)activate(q)}});
c.addEventListener('pointermove',e=>{if(!dragging)return;const p=pointer(e);const dx=p.x-SL.x,dy=p.y-SL.y;const m=clamp(Math.hypot(dx,dy),0,150),a=Math.atan2(dy,dx);aim={x:SL.x+Math.cos(a)*m,y:SL.y+Math.sin(a)*m}});
c.addEventListener('pointerup',()=>{if(!dragging)return;const b=nextBird();if(b)launch(b,aim.x,aim.y);aim={x:SL.x,y:SL.y}});
document.getElementById('restartBtn').onclick=()=>load(level);
document.getElementById('pauseBtn').onclick=()=>{paused=!paused;document.getElementById('pauseBtn').textContent=paused?'Resume':'Pause';ui.msg.textContent=paused?'Paused':'Drag the bird back'};
document.getElementById('levelsBtn').onclick=()=>ui.levels.classList.toggle('open');
document.getElementById('againBtn').onclick=()=>load(level);
document.getElementById('nextBtn').onclick=()=>load(level<50?level+1:1);
document.getElementById('closeBtn').onclick=()=>ui.modal.classList.remove('show');
window.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='r')load(level);if(e.key.toLowerCase()==='p')document.getElementById('pauseBtn').click();if(e.key.toLowerCase()==='l')ui.levels.classList.toggle('open')});
function drawBird(b){
 ctx.save();ctx.translate(b.x,b.y);ctx.rotate(Math.atan2(b.vy,b.vx)||0);
 ctx.fillStyle=b.type==='yellow'?'#f5c542':b.type==='blue'?'#4ba8ff':b.type==='black'?'#2b2e35':'#e74c3c';ctx.beginPath();ctx.arc(0,0,b.r,0,TAU);ctx.fill();
 ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(8,-7,6,0,TAU);ctx.arc(8,7,6,0,TAU);ctx.fill();ctx.fillStyle='#111';ctx.beginPath();ctx.arc(10,-7,2.7,0,TAU);ctx.arc(10,7,2.7,0,TAU);ctx.fill();
 ctx.fillStyle='#e8a52a';ctx.beginPath();ctx.moveTo(17,0);ctx.lineTo(34,-4);ctx.lineTo(17,7);ctx.fill();
 ctx.restore();
}
function render(){
 ctx.clearRect(0,0,W,H);
 const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#75c9f5');sky.addColorStop(1,'#d8f4ff');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
 ctx.fillStyle='#74b957';ctx.fillRect(0,G,W,H-G);ctx.fillStyle='#5b963f';ctx.fillRect(0,G,W,9);
 // distant hills
 ctx.fillStyle='#8ccf72';ctx.beginPath();ctx.moveTo(0,G);for(let x=0;x<=W;x+=80)ctx.quadraticCurveTo(x+40,G-90-(x%160)/3,x+80,G);ctx.fill();
 // slingshot
 ctx.strokeStyle='#6f4227';ctx.lineWidth=18;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(SL.x-15,G+10);ctx.lineTo(SL.x-22,SL.y-5);ctx.moveTo(SL.x+15,G+10);ctx.lineTo(SL.x+22,SL.y-5);ctx.stroke();
 const b=nextBird();if(b&&dragging){ctx.strokeStyle='#4b2d20';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(SL.x-20,SL.y-8);ctx.lineTo(aim.x,aim.y);ctx.lineTo(SL.x+20,SL.y-8);ctx.stroke();ctx.setLineDash([7,9]);ctx.strokeStyle='#ffffffaa';ctx.lineWidth=3;ctx.beginPath();let px=SL.x,py=SL.y,vx=(SL.x-aim.x)*.105,vy=(SL.y-aim.y)*.105;ctx.moveTo(px,py);for(let i=0;i<28;i++){vy+=.34*1.2;px+=vx*1.2;py+=vy*1.2;ctx.lineTo(px,py)}ctx.stroke();ctx.setLineDash([])}
 for(const k of blocks){ctx.save();ctx.translate(k.x,k.y);ctx.rotate(k.rot);ctx.fillStyle=matColor(k.m);ctx.fillRect(-k.w/2,-k.h/2,k.w,k.h);ctx.strokeStyle='#0005';ctx.strokeRect(-k.w/2,-k.h/2,k.w,k.h);ctx.restore()}
 for(const p of pigs){ctx.fillStyle='#7ac943';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,TAU);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(p.x-7,p.y-5,6,0,TAU);ctx.arc(p.x+7,p.y-5,6,0,TAU);ctx.fill();ctx.fillStyle='#222';ctx.beginPath();ctx.arc(p.x-7,p.y-5,2.5,0,TAU);ctx.arc(p.x+7,p.y-5,2.5,0,TAU);ctx.fill();ctx.fillStyle='#4e8c2a';ctx.fillRect(p.x-8,p.y+8,16,5)}
 for(const q of particles){ctx.globalAlpha=Math.max(0,q.life/45);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,TAU);ctx.fill()}ctx.globalAlpha=1;
 for(const q of birds){if(q.trail)for(let i=0;i<q.trail.length;i++){ctx.globalAlpha=i/q.trail.length*.22;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(q.trail[i].x,q.trail[i].y,3,0,TAU);ctx.fill()}ctx.globalAlpha=1;if(q.state==='ready')drawBird(q);else if(q.state==='fly')drawBird(q)}
 if(birds.length){const ready=nextBird();if(ready&&ready.state==='ready'){ctx.globalAlpha=.75;drawBird({...ready,x:SL.x,y:SL.y});ctx.globalAlpha=1}}
}
function loop(t){const dt=clamp((t-last)/16.67,0,2);last=t;physics(dt);render();requestAnimationFrame(loop)}
renderLevels();buildLevel(1);requestAnimationFrame(loop);
})();
</script>
</body>
</html>
