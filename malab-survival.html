<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Malab Survival</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090d18;font-family:system-ui,Arial;color:#fff}body{display:grid;place-items:center}
#wrap{position:relative;width:min(960px,100vw);height:min(600px,100svh);overflow:hidden;background:#101827;touch-action:none}canvas{display:block;width:100%;height:100%}
#hud{position:absolute;top:12px;left:12px;right:12px;z-index:4;display:flex;gap:8px;justify-content:space-between;pointer-events:none}.box{background:#07101dcc;border:1px solid #fff2;border-radius:13px;padding:8px 12px;font-weight:900;box-shadow:0 8px 22px #0006}
#overlay{position:absolute;inset:0;z-index:8;display:grid;place-items:center;background:#050914aa}.card{width:min(500px,90%);padding:25px;text-align:center;background:#111a2bf2;border:1px solid #fff2;border-radius:24px;box-shadow:0 20px 70px #000b}.card h1{font-size:46px;margin:0 0 8px}.card p{color:#d6dfed;line-height:1.5}button{border:0;border-radius:15px;padding:14px 28px;background:#ffd43b;color:#302300;font-weight:950;font-size:18px;cursor:pointer;box-shadow:0 8px 20px #0006}
#touch{position:absolute;left:12px;right:12px;bottom:12px;z-index:5;display:flex;justify-content:space-between;pointer-events:none}.pad{display:flex;gap:8px}.t{pointer-events:auto;width:58px;height:58px;border-radius:50%;border:1px solid #fff3;background:#07101dbb;color:#fff;font-size:23px;font-weight:900}
#tip{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);z-index:3;background:#07101d99;padding:7px 11px;border-radius:10px;font-size:12px;white-space:nowrap;pointer-events:none}
</style></head><body><div id="wrap"><canvas id="game"></canvas>
<div id="hud"><div class="box">❤️ <span id="hp">100</span></div><div class="box">⚔️ <span id="level">1</span> &nbsp; ⭐ <span id="xp">0</span></div><div class="box">💀 <span id="kills">0</span> &nbsp; ⏱️ <span id="time">0</span></div></div>
<div id="tip">Move with WASD/Arrow • auto-attack • collect XP • survive the waves</div>
<div id="touch"><div class="pad"><button class="t" id="l">◀</button><button class="t" id="r">▶</button></div><div class="pad"><button class="t" id="u">▲</button><button class="t" id="d">▼</button></div></div>
<div id="overlay"><div class="card"><h1>Malab Survival</h1><p>Your face is the hero. Survive enemy waves, collect XP, level up and choose powerful upgrades.</p><button id="start">START SURVIVAL</button></div></div>
</div>
<script>
(()=>{const c=document.getElementById('game'),g=c.getContext('2d'),wrap=document.getElementById('wrap'),face=new Image();face.src='malab-face.jpg?v=8';
const W=960,H=600; c.width=W;c.height=H;let keys={},run=false,last=0,raf=0,t=0,kills=0,level=1,xp=0,nextXP=8,hp=100,shots=1,damage=22,fire=.55,fireCd=0,spawnCd=0,bossTimer=28,camShake=0,particles=[],enemies=[],bullets=[],orbs=[],upgrades=['DOUBLE SHOT','FASTER ATTACK','POWER +12'];let p;
function reset(){p={x:480,y:320,r:26,s:230};t=0;kills=0;level=1;xp=0;nextXP=8;hp=100;shots=1;damage=22;fire=.55;fireCd=0;spawnCd=.5;bossTimer=28;particles=[];enemies=[];bullets=[];orbs=[]}
function start(){reset();run=true;document.getElementById('overlay').style.display='none';last=performance.now();raf=requestAnimationFrame(loop)}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function burst(x,y,n=8){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*180,vy:(Math.random()-.5)*180,life:.5,size:2+Math.random()*4})}
function spawn(kind='enemy'){let side=Math.floor(Math.random()*4),x=side<2?(side?W+40:-40):Math.random()*W,y=side<2?Math.random()*H:(side===2?-40:H+40);enemies.push({x,y,r:kind==='boss'?34:18,s:kind==='boss'?42:65+Math.random()*35,hp:kind==='boss'?600:45+level*8,max:kind==='boss'?600:45+level*8,kind})}
function shoot(){let alive=enemies.filter(e=>e.hp>0);if(!alive.length)return;alive.sort((a,b)=>dist(p,a)-dist(p,b));for(let i=0;i<shots;i++){let e=alive[Math.min(i,alive.length-1)],a=Math.atan2(e.y-p.y,e.x-p.x)+(i-(shots-1)/2)*.13;bullets.push({x:p.x,y:p.y,vx:Math.cos(a)*500,vy:Math.sin(a)*500,dmg:damage,life:1.5})}}
function gainXP(){xp++;if(xp>=nextXP){xp-=nextXP;level++;nextXP=Math.floor(nextXP*1.35);document.getElementById('overlay').innerHTML='<div class="card"><h1>LEVEL '+level+' ⚡</h1><p>Choose an upgrade.</p><button id="up">UPGRADE</button></div>';document.getElementById('overlay').style.display='grid';run=false;document.getElementById('up').onclick=()=>{let q=upgrades[Math.floor(Math.random()*upgrades.length)];if(q==='DOUBLE SHOT')shots++;if(q==='FASTER ATTACK')fire=Math.max(.18,fire-.09);if(q==='POWER +12')damage+=12;document.getElementById('overlay').style.display='none';run=true;last=performance.now();raf=requestAnimationFrame(loop)}}}
function gameOver(){run=false;document.getElementById('overlay').innerHTML='<div class="card"><h1>💀 WAVE OVER</h1><p>Level <b>'+level+'</b> • Kills <b>'+kills+'</b> • Survived <b>'+Math.floor(t)+'s</b></p><button id="again">PLAY AGAIN</button></div>';document.getElementById('overlay').style.display='grid';document.getElementById('again').onclick=start}
function update(dt){t+=dt;fireCd-=dt;spawnCd-=dt;bossTimer-=dt;camShake=Math.max(0,camShake-dt);
let dx=(keys.r?1:0)-(keys.l?1:0),dy=(keys.d?1:0)-(keys.u?1:0);let m=Math.hypot(dx,dy)||1;p.x+=dx/m*p.s*dt;p.y+=dy/m*p.s*dt;p.x=Math.max(30,Math.min(W-30,p.x));p.y=Math.max(60,Math.min(H-35,p.y));
if(spawnCd<=0){spawn();spawnCd=Math.max(.25,1.05-t*.006)}
if(bossTimer<=0){spawn('boss');bossTimer=35}
if(fireCd<=0){shoot();fireCd=fire}
for(const b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;for(const e of enemies)if(e.hp>0&&Math.hypot(b.x-e.x,b.y-e.y)<e.r+5){e.hp-=b.dmg;b.life=0;burst(b.x,b.y,3);break}}
for(const e of enemies){if(e.hp<=0)continue;let a=Math.atan2(p.y-e.y,p.x-e.x);e.x+=Math.cos(a)*e.s*dt;e.y+=Math.sin(a)*e.s*dt;if(Math.hypot(p.x-e.x,p.y-e.y)<p.r+e.r){hp-=e.kind==='boss'?24:10;camShake=.15;e.hp=0;burst(e.x,e.y,12);if(hp<=0)return gameOver()}}
for(let i=enemies.length-1;i>=0;i--)if(enemies[i].hp<=0){let e=enemies[i];kills++;orbs.push({x:e.x,y:e.y,v:1+(e.kind==='boss'?10:2)});enemies.splice(i,1)}
for(const o of orbs){let d=Math.hypot(p.x-o.x,p.y-o.y);if(d<130){let a=Math.atan2(p.y-o.y,p.x-o.x);o.x+=Math.cos(a)*300*dt;o.y+=Math.sin(a)*300*dt}if(Math.hypot(p.x-o.x,p.y-o.y)<p.r+9){o.v--;if(o.v<=0){o.dead=1;gainXP()}}}
bullets=bullets.filter(b=>b.life>0&&b.x>-50&&b.x<W+50&&b.y>-50&&b.y<H+50);orbs=orbs.filter(o=>!o.dead);
document.getElementById('hp').textContent=Math.max(0,Math.ceil(hp));document.getElementById('level').textContent=level;document.getElementById('xp').textContent=xp+'/'+nextXP;document.getElementById('kills').textContent=kills;document.getElementById('time').textContent=Math.floor(t)}
function draw(){g.clearRect(0,0,W,H);g.fillStyle='#111a28';g.fillRect(0,0,W,H);g.strokeStyle='#1d2a3c';g.lineWidth=1;for(let x=0;x<W;x+=48){g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke()}for(let y=0;y<H;y+=48){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke()}
for(const o of orbs){g.fillStyle='#7be7ff';g.beginPath();g.arc(o.x,o.y,6,0,7);g.fill()}
for(const e of enemies)if(e.hp>0){g.fillStyle=e.kind==='boss'?'#d946ef':'#e85d75';g.beginPath();g.arc(e.x,e.y,e.r,0,7);g.fill();g.fillStyle='#111';g.beginPath();g.arc(e.x-6,e.y-3,3,0,7);g.arc(e.x+6,e.y-3,3,0,7);g.fill();if(e.kind==='boss'){g.strokeStyle='#ffd43b';g.lineWidth=4;g.stroke()}}
for(const b of bullets){g.fillStyle='#ffd43b';g.beginPath();g.arc(b.x,b.y,5,0,7);g.fill()}
for(let i=particles.length-1;i>=0;i--){let q=particles[i];q.x+=q.vx*.016;q.y+=q.vy*.016;q.life-=.016;g.globalAlpha=Math.max(0,q.life*2);g.fillStyle='#fff';g.fillRect(q.x,q.y,q.size,q.size);if(q.life<=0)particles.splice(i,1)}g.globalAlpha=1;
g.save();g.translate((Math.random()-.5)*camShake*20,(Math.random()-.5)*camShake*20);g.save();g.beginPath();g.arc(p.x,p.y,27,0,7);g.clip();g.drawImage(face,p.x-27,p.y-27,54,54);g.restore();g.fillStyle='#38bdf8';g.fillRect(p.x-18,p.y+21,36,20);g.fillStyle='#111';g.fillRect(p.x-18,p.y+39,13,7);g.fillRect(p.x+5,p.y+39,13,7);g.restore()}
function loop(now){if(!run)return;let dt=Math.min(.033,(now-last)/1000);last=now;update(dt);draw();raf=requestAnimationFrame(loop)}
function bind(id,k){let b=document.getElementById(id);b.onpointerdown=e=>{e.preventDefault();keys[k]=1};b.onpointerup=()=>keys[k]=0;b.onpointercancel=()=>keys[k]=0;b.onpointerleave=()=>keys[k]=0}
bind('l','l');bind('r','r');bind('u','u');bind('d','d');addEventListener('keydown',e=>{if(e.code==='ArrowLeft'||e.code==='KeyA')keys.l=1;if(e.code==='ArrowRight'||e.code==='KeyD')keys.r=1;if(e.code==='ArrowUp'||e.code==='KeyW')keys.u=1;if(e.code==='ArrowDown'||e.code==='KeyS')keys.d=1});addEventListener('keyup',e=>{if(e.code==='ArrowLeft'||e.code==='KeyA')keys.l=0;if(e.code==='ArrowRight'||e.code==='KeyD')keys.r=0;if(e.code==='ArrowUp'||e.code==='KeyW')keys.u=0;if(e.code==='ArrowDown'||e.code==='KeyS')keys.d=0});
document.getElementById('start').onclick=start;reset();draw()})();
</script></body></html>
