<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Username Finder</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#070b14;color:#eef2ff}
body{min-height:100vh;display:grid;place-items:center;padding:22px}
.app{width:min(720px,100%);background:linear-gradient(180deg,#101827,#0b101c);border:1px solid #202b3f;border-radius:28px;padding:28px;box-shadow:0 24px 80px #0008}
.badge{display:inline-flex;padding:7px 11px;border-radius:999px;background:#172238;color:#8fb8ff;font-size:12px;font-weight:700;letter-spacing:.4px}
h1{font-size:clamp(32px,8vw,54px);line-height:1;margin:18px 0 10px;letter-spacing:-2px}
.sub{color:#94a3b8;margin:0 0 24px;line-height:1.5}
.search{display:flex;gap:10px}
input{flex:1;min-width:0;border:1px solid #2b3850;background:#070d18;color:#fff;border-radius:15px;padding:16px;font-size:16px;outline:none}
input:focus{border-color:#6d9cff;box-shadow:0 0 0 3px #6d9cff22}
button{border:0;border-radius:15px;padding:0 22px;background:#fff;color:#07101d;font-weight:800;font-size:15px;cursor:pointer;min-width:112px}
button:disabled{opacity:.55;cursor:wait}
.note{font-size:12px;color:#64748b;margin:12px 2px 0}
.status{margin-top:22px;padding:15px;border-radius:15px;background:#0b1422;color:#9fb0c9;display:none}
.results{margin-top:18px;display:grid;gap:10px}
.card{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 16px;border:1px solid #202d42;background:#0d1523;border-radius:16px}
.site{font-weight:750}.url{font-size:12px;color:#71839e;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:430px;margin-top:4px}
.open{flex:none;color:#9fc0ff;text-decoration:none;font-size:13px;font-weight:700}
.empty{padding:25px;text-align:center;color:#8190a8;border:1px dashed #26344a;border-radius:16px}
@media(max-width:560px){body{padding:12px}.app{padding:20px;border-radius:22px}.search{flex-direction:column}button{height:52px}.card{align-items:flex-start}.url{max-width:210px}}
</style>
</head>
<body>
<main class="app">
  <span class="badge">SHERLOCK • USERNAME SEARCH</span>
  <h1>Find a username.</h1>
  <p class="sub">Check public username presence across Sherlock's supported sites. No passwords or private account data.</p>
  <form class="search" id="form">
    <input id="username" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Enter username, e.g. sanskar123" maxlength="80" required>
    <button id="btn" type="submit">Search</button>
  </form>
  <div class="note">Public checks only • Results may contain false positives.</div>
  <div class="status" id="status"></div>
  <section class="results" id="results"></section>
</main>
<script>
const form=document.getElementById('form'),input=document.getElementById('username'),btn=document.getElementById('btn'),status=document.getElementById('status'),results=document.getElementById('results');
function showStatus(t){status.textContent=t;status.style.display='block'}
function hideStatus(){status.style.display='none'}
form.addEventListener('submit',async e=>{
 e.preventDefault(); const username=input.value.trim();
 if(!/^[A-Za-z0-9._-]{1,80}$/.test(username)){showStatus('Use only letters, numbers, dots, underscores or hyphens.');return}
 btn.disabled=true;btn.textContent='Searching…';results.innerHTML='';showStatus('Sherlock is checking public sites. This can take a little while…');
 try{
  const r=await fetch('/api/sherlock',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username})});
  const data=await r.json();
  if(!r.ok) throw new Error(data.error||'Search failed.');
  hideStatus();
  if(!data.results?.length){results.innerHTML='<div class="empty">No public matches found.</div>';return}
  results.innerHTML=data.results.map(x=>'<article class="card"><div><div class="site">'+escapeHtml(x.site)+'</div><div class="url">'+escapeHtml(x.url)+'</div></div><a class="open" href="'+encodeURI(x.url)+'" target="_blank" rel="noopener noreferrer">Open ↗</a></article>').join('');
 }catch(err){showStatus(err.message||'Something went wrong.')}
 finally{btn.disabled=false;btn.textContent='Search'}
});
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
</script>
</body>
</html>
